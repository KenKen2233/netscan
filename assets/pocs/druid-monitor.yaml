id: druid-monitor
info:
  name: Druid Monitor Console
  author: netscan
  severity: medium
  tags:
    - druid
    - monitor
    - exposure

requests:
  - method: GET
    path: /druid/index.html
    matchers:
      - type: word
        words:
          - "Druid"
          - "DruidStatView"
        condition: or
        part: body
      - type: status
        status: [200]
